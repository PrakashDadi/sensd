{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}SENSD - GIS{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{% static 'css/sensd-ui.css' %}">
    {% block css %}{% endblock %}
</head>

<body class="sensd-app">

    <nav class="navbar navbar-expand-lg navbar-dark sensd-navbar sticky-top" aria-label="GIS navigation">
        <div class="container-fluid px-lg-4">
            <a class="navbar-brand" href="{% url 'gis-home' %}">SENSD <span class="fw-normal opacity-75">GIS</span></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#gisNavbar"
                aria-controls="gisNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="gisNavbar">
                <ul class="navbar-nav mx-auto gap-lg-1">
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'gis-home' %}active{% endif %}"
                            href="{% url 'gis-home' %}">
                            <i class="bi bi-house-door me-1"></i>Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'gis_dashboard' %}active{% endif %}"
                            href="{% url 'gis_dashboard' %}">
                            <i class="bi bi-geo-alt me-1"></i>GIS Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'maps_view' %}active{% endif %}"
                            href="{% url 'maps_view' %}">
                            <i class="bi bi-map me-1"></i>Maps
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'flow_analysis' %}active{% endif %}"
                            href="{% url 'flow_analysis' %}">
                            <i class="bi bi-diagram-3 me-1"></i>Flow Analysis
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'data_mapping_tool' %}active{% endif %}"
                            href="{% url 'data_mapping_tool' %}">
                            <i class="bi bi-upload me-1"></i>Data Mapping
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'grid_view' %}active{% endif %}"
                            href="{% url 'grid_view' %}">
                            <i class="bi bi-grid me-1"></i>Grid View
                        </a>
                    </li>
                </ul>
                <ul class="navbar-nav gap-lg-1">
                    <li class="nav-item"><a class="nav-link" href="{% url 'sensd' %}">Optimization</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'profile' %}">Profile</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'logout' %}">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    {% block content %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    {% block js %}{% endblock %}

</body>

</html>
